services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bsp
      POSTGRES_PASSWORD: bsp
      POSTGRES_DB: bsp
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsp -d bsp"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bsp:bsp@db:5432/bsp
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CANONICAL_REPO_PATH: /canonical-repo
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./canonical-repo:/canonical-repo
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bsp:bsp@db:5432/bsp
      CANONICAL_REPO_PATH: /canonical-repo
    # aplica o schema do procrastinate apenas se ainda não existir (healthcheck falha).
    # Só a fila default: a fila `discovery` precisa do CLI `claude` e roda em worker no HOST.
    command: sh -c "procrastinate --app=app.jobs.job_app healthchecks || procrastinate --app=app.jobs.job_app schema --apply; exec procrastinate --app=app.jobs.job_app worker --queues default"
    volumes:
      - ./canonical-repo:/canonical-repo
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      # 3001 no host: a 3000 costuma estar ocupada (ex.: Grafana local)
      - "3001:3000"

volumes:
  dbdata:
